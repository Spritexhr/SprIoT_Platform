name: Backend checks

on:
  push:
    paths:
      - "iot_control_platform/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "iot_control_platform/**"
      - ".github/workflows/backend.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-password
          MYSQL_DATABASE: iot_platform
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -ptest-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    env:
      DEBUG: "True"
      DB_USE_MYSQL: "true"
      DB_NAME: iot_platform
      DB_USER: root
      DB_PASSWORD: test-password
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      REDIS_URL: redis://127.0.0.1:6379/15
      AUTOMATION_SCRIPT_EXECUTION_ENABLED: "False"

    defaults:
      run:
        working-directory: iot_control_platform

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: iot_control_platform/requirements.txt
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y default-libmysqlclient-dev pkg-config
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Validate dependency graph
        run: pip check
      - name: Run Django checks
        run: python manage.py check
      - name: Check committed migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Run backend tests
        run: python manage.py test --verbosity 1
