name: iot_control_platform

services:
  mysql:
    image: docker.m.daocloud.io/library/mysql:8.0
    pull_policy: if_not_present
    container_name: iot-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-iot_platform}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: docker.m.daocloud.io/library/redis:7-alpine
    pull_policy: if_not_present
    container_name: iot-redis
    # Streams 承载设备控制命令；AOF 将宿主机故障时的丢失窗口限制在约 1 秒。
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes", "--appendfsync", "everysec", "--loglevel", "warning"]
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./iot_control_platform
      dockerfile: Dockerfile
    container_name: iot-backend
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
      - IOT_RUNTIME_ENV=production
      - DB_USE_MYSQL=true
      - DB_NAME=${DB_NAME:-iot_platform}
      - DB_USER=${DB_USER:-root}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=mysql
      - DB_PORT=3306
      - REDIS_URL=redis://redis:6379/0
      # web worker 永不创建 Paho client；命令经 Redis Streams 交给 mqtt_runner。
    command:
      - sh
      - -c
      - >-
        python manage.py migrate --noinput &&
        python manage.py configure --init --no-reload &&
        python manage.py collectstatic --noinput &&
        gunicorn config.asgi:application
        --bind 0.0.0.0:8000
        --workers 2
        --worker-class uvicorn.workers.UvicornWorker
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "0.0.0.0:${ADMIN_PORT:-48081}:8000"
    restart: unless-stopped
    healthcheck:
      # gunicorn 真正监听端口前，必须先跑完 migrate + configure --init，
      # 同时真实检查 MySQL/Redis；该端点不依赖 mqtt_runner，避免启动循环等待。
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/backend/', timeout=2).read()"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  mqtt_runner:
    build:
      context: ./iot_control_platform
      dockerfile: Dockerfile
    container_name: iot-mqtt-runner
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
      - IOT_RUNTIME_ENV=production
      - DB_USE_MYSQL=true
      - DB_NAME=${DB_NAME:-iot_platform}
      - DB_USER=${DB_USER:-root}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=mysql
      - DB_PORT=3306
      - REDIS_URL=redis://redis:6379/0
      # 稳定 client id + persistent session，runner 重连期间 broker 可保留 QoS1 队列。
      - MQTT_CLIENT_ID=${MQTT_CLIENT_ID:-spr-iot-platform-runner}
    command: ["python", "manage.py", "mqtt_runner"]
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        # 等 backend 的 healthcheck 通过（即 migrate + configure --init 已完成、gunicorn 已监听）
        # 才启动，避免读到 platform_settings 默认值（127.0.0.1）
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import os,time,redis;
          r=redis.Redis.from_url(os.environ['REDIS_URL'],decode_responses=True,socket_timeout=2);
          p=os.environ.get('MQTT_BUS_PREFIX','spr:iot:mqtt');
          h=r.hgetall(p+':runner:status:v1');
          lease=r.get(p+':runner:lease:v1');
          assert h and lease and h.get('instance_id') == lease and h.get('command_worker_alive') == '1' and time.time()*1000-int(h['heartbeat_at_ms']) < 20000
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s

  data_cleanup:
    # 历史数据删除属于破坏性维护操作，默认不随常规 compose up 启动。
    # 显式启用：docker compose --profile maintenance up -d data_cleanup
    profiles:
      - maintenance
    build:
      context: ./iot_control_platform
      dockerfile: Dockerfile
    container_name: iot-data-cleanup
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
      - IOT_RUNTIME_ENV=production
      - DB_USE_MYSQL=true
      - DB_NAME=${DB_NAME:-iot_platform}
      - DB_USER=${DB_USER:-root}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=mysql
      - DB_PORT=3306
      - REDIS_URL=redis://redis:6379/0
      - DATA_CLEANUP_INITIAL_DELAY_SECONDS=${DATA_CLEANUP_INITIAL_DELAY_SECONDS:-86400}
      - DATA_CLEANUP_INTERVAL_SECONDS=${DATA_CLEANUP_INTERVAL_SECONDS:-86400}
      - DATA_CLEANUP_BATCH_SIZE=${DATA_CLEANUP_BATCH_SIZE:-1000}
    command:
      - sh
      - -ec
      - >-
        initial_delay="$${DATA_CLEANUP_INITIAL_DELAY_SECONDS:-86400}";
        interval="$${DATA_CLEANUP_INTERVAL_SECONDS:-86400}";
        batch_size="$${DATA_CLEANUP_BATCH_SIZE:-1000}";
        case "$$initial_delay" in ''|*[!0-9]*) echo "DATA_CLEANUP_INITIAL_DELAY_SECONDS 必须是整数" >&2; exit 64;; esac;
        case "$$interval" in ''|*[!0-9]*) echo "DATA_CLEANUP_INTERVAL_SECONDS 必须是整数" >&2; exit 64;; esac;
        case "$$batch_size" in ''|*[!0-9]*) echo "DATA_CLEANUP_BATCH_SIZE 必须是整数" >&2; exit 64;; esac;
        if [ "$$initial_delay" -lt 3600 ]; then echo "DATA_CLEANUP_INITIAL_DELAY_SECONDS 不能小于 3600" >&2; exit 64; fi;
        if [ "$$interval" -lt 3600 ]; then echo "DATA_CLEANUP_INTERVAL_SECONDS 不能小于 3600" >&2; exit 64; fi;
        if [ "$$batch_size" -lt 1 ] || [ "$$batch_size" -gt 10000 ]; then echo "DATA_CLEANUP_BATCH_SIZE 必须在 1 到 10000 之间" >&2; exit 64; fi;
        echo "先执行试运行；不会在容器启动时立即删除数据";
        python manage.py cleanup_old_data --dry-run --batch-size "$$batch_size";
        echo "试运行完成，等待 $$initial_delay 秒后才会首次执行真实清理";
        sleep "$$initial_delay";
        while true; do
          echo "开始执行定期历史数据清理";
          python manage.py cleanup_old_data --batch-size "$$batch_size";
          echo "清理完成，等待 $$interval 秒后再次执行";
          sleep "$$interval";
        done
    env_file:
      - .env
    depends_on:
      backend:
        condition: service_healthy
    # 错误不得被吞掉；有限重试后保持失败状态，便于从 docker ps/logs 发现。
    restart: "on-failure:3"

  mcp:
    build:
      context: ./mcp
      dockerfile: Dockerfile
    container_name: iot-mcp
    environment:
      - IOT_API_BASE_URL=http://backend:8000/api
      - IOT_API_USERNAME=${IOT_API_USERNAME:-}
      - IOT_API_PASSWORD=${IOT_API_PASSWORD:-}
      - IOT_API_ACCESS_TOKEN=${IOT_API_ACCESS_TOKEN:-}
      - IOT_MCP_CONFIRMATION_SECRET=${IOT_MCP_CONFIRMATION_SECRET:-}
      - IOT_MCP_TRANSPORT=streamable-http
      - IOT_MCP_HOST=0.0.0.0
      - IOT_MCP_PORT=8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${MCP_HOST_PORT:-48082}:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: iot-frontend
    ports:
      - "0.0.0.0:${FRONTEND_PORT:-48080}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
