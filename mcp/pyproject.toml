[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "iot-control-platform-mcp"
version = "0.1.0"
description = "通过 MCP 安全读写 IoT 控制平台"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27,<1",
    "mcp>=1.27,<2",
]

[project.scripts]
iot-mcp = "iot_mcp.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["iot_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
